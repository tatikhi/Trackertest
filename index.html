<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Adventure Tracker</title>
    <!-- Подключаем дружелюбный детский шрифт Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF8FF;
            --card-bg: #FFFFFF;
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFD166;
            --text-color: #2D3748;
            --shadow: 0 8px 0 rgba(0, 0, 0, 0.1);
            --shadow-hover: data;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(#BEE3F8 20%, transparent 20%), radial-gradient(#BEE3F8 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 4px solid #3182CE;
            box-shadow: 0 12px 0 #3182CE;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Шапка с маскотом */
        header {
            background: #4FD1C5;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #319795;
            position: relative;
        }

        .mascot-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .mascot {
            font-size: 50px;
            background: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #2B6CB0;
            box-shadow: 0 4px 0 #2B6CB0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-title h1 {
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 0 #2B6CB0;
        }

        .header-title p {
            font-size: 14px;
            color: #FEFCBF;
            font-weight: 600;
        }

        /* Информация об ученике */
        .profile-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FEFCBF;
            margin: 15px;
            padding: 12px 20px;
            border-radius: 20px;
            border: 3px solid #D69E2E;
        }

        .student-info {
            font-size: 18px;
            font-weight: 700;
            color: #744210;
        }

        .stars-counter {
            background: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid #D69E2E;
            color: #D69E2E;
        }

        /* Тема недели */
        .week-banner {
            background: #FF6B6B;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            border-top: 3px solid #C53030;
            border-bottom: 3px solid #C53030;
            text-shadow: 1px 1px 0 #9B2C2C;
        }

        /* Карта приключений (Путь) */
        .map-path {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .path-node {
            display: flex;
            align-items: center;
            background: #EDF2F7;
            padding: 12px 15px;
            border-radius: 20px;
            border: 3px solid #CBD5E0;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .path-node:hover {
            transform: scale(1.02);
        }

        .path-node.completed {
            background: #C6F6D5;
            border-color: #38A169;
        }

        .node-icon {
            font-size: 32px;
            background: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            border: 3px solid inherit;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .node-details h3 {
            font-size: 16px;
            color: #2D3748;
        }

        .node-details p {
            font-size: 13px;
            color: #718096;
        }

        .node-status {
            margin-left: auto;
            font-size: 24px;
        }

        /* Подвал */
        footer {
            background: #EDF2F7;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 3px solid #E2E8F0;
            margin-top: auto;
        }

        .teacher-info {
            font-size: 14px;
            font-weight: 600;
            color: #4A5568;
        }

        .btn-contact {
            background: #48BB78;
            color: white;
            padding: 8px 16px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            border: 3px solid #2F855A;
            box-shadow: 0 4px 0 #2F855A;
            transition: all 0.1s;
        }

        .btn-contact:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2F855A;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка с маскотом -->
        <header>
            <div class="mascot-container">
                <div class="mascot">🦊</div>
                <div class="header-title">
                    <h1>STAR ADVENTURE</h1>
                    <p>Английский для детей</p>
                </div>
            </div>
        </header>

        <!-- Профиль ученика -->
        <div class="profile-card">
            <div class="student-info">👤 Алиса, 6 лет</div>
            <div class="stars-counter" id="starsDisplay">⭐ 2/4</div>
        </div>

        <!-- Название недели -->
        <div class="week-banner">НЕДЕЛЯ 1 : ЦВЕТА 🎨</div>

        <!-- Карта заданий (Интерактивный путь) -->
        <div class="map-path">
            <div class="path-node completed" onclick="toggleNode(this)">
                <div class="node-icon">🔴</div>
                <div class="node-details">
                    <h3>Красный цвет</h3>
                    <p>Найти дома красный предмет</p>
                </div>
                <div class="node-status">🌟</div>
            </div>

            <div class="path-node completed" onclick="toggleNode(this)">
                <div class="node-icon">🔵</div>
                <div class="node-details">
                    <h3>Синий цвет</h3>
                    <p>Спеть песенку о синем небе</p>
                </div>
                <div class="node-status">🌟</div>
            </div>

            <div class="path-node" onclick="toggleNode(this)">
                <div class="node-icon">🟡</div>
                <div class="node-details">
                    <h3>Желтый цвет</h3>
                    <p>Нарисовать солнце по-английски</p>
                </div>
                <div class="node-status">🔒</div>
            </div>

            <div class="path-node" onclick="toggleNode(this)">
                <div class="node-icon">🟢</div>
                <div class="node-details">
                    <h3>Зеленый цвет</h3>
                    <p>Игра «Найди листочек»</p>
                </div>
                <div class="node-status">🔒</div>
            </div>
        </div>

        <!-- Контакты преподавателя -->
        <footer>
            <div class="teacher-info">Педагог: Татьяна 👩‍🏫</div>
            <a href="https://t.me/tati_khi" target="_blank" class="btn-contact">СВЯЗАТЬСЯ</a>
        </footer>
    </div>

    <script>
        // Простая интерактивность для демонстрации геймификации
        function toggleNode(element) {
            const status = element.querySelector('.node-status');
            
            if (element.classList.contains('completed')) {
                element.classList.remove('completed');
                status.textContent = '🔒';
            } else {
                element.classList.add('completed');
                status.textContent = '🌟';
                // Небольшой эффект подпрыгивания при клике
                element.style.transform = 'scale(1.05)';
                setTimeout(() => { element.style.transform = 'scale(1)'; }, 200);
            }
            
            updateStars();
        }

        function updateStars() {
            const completedCount = document.querySelectorAll('.path-node.completed').length;
            const totalCount = document.querySelectorAll('.path-node').length;
            document.getElementById('starsDisplay').textContent = `⭐ ${completedCount}/${totalCount}`;
        }
    </script>
</body>
</html>
