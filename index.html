<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <!-- Подключаем детский округлый шрифт Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #e4cab4;
            --text-main: #382b2c;
            --border-color: #d1b59c;
            --accent-green: #75a4b3;
            --accent-green-dark: #568393;
            --btn-adult: #d4b8a0;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px; 
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* HEADER */
        header { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 20px; 
            border: 2px solid var(--border-color); 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
        }

        .header-title { 
            font-size: 1.4rem; 
            font-weight: 700; 
            margin-bottom: 15px; 
            letter-spacing: 0.05em;
        }

        /* ИГРОВАЯ ДОРОЖКА ИЗ 8 ЛАПОК БЕЗ РАМОК */
        .path-progress { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            background: #d4b8a0; 
            padding: 10px 12px; 
            border-radius: 12px; 
            flex-wrap: wrap;
        }

        .step-node { 
            font-size: 1.2rem; 
            background: #ffffff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .step-node.active { 
            background: var(--accent-green);
            filter: drop-shadow(0 0 3px var(--accent-green)); 
        }

        /* БЛОК ИМЕНИ И ВОЗРАСТА */
        .student-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 24px;
            border: 2px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
            opacity: 0.8;
            font-weight: 700;
        }

        .info-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        /* НАДПИСЬ НЕДЕЛЯ 1 */
        .section-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        /* КАРТОЧКА ЗАДАНИЯ */
        .lesson-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 24px; 
            border: 2px solid var(--border-color); 
            position: relative; 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* КНОПКА-ДУБЛЕР (ДЛЯ РОДИТЕЛЯ В УГЛУ) */
        .adult-check { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            font-size: 0.75rem; 
            background: var(--btn-adult); 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid var(--border-color);
            font-weight: 700;
            transition: all 0.2s;
        }

        .adult-check.completed {
            background: var(--accent-green);
            color: #fff;
        }

        .lesson-header { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
        }

        .lesson-number { 
            font-size: 1.15rem; 
            font-weight: 700; 
        }

        .lesson-topic { 
            font-size: 1.15rem; 
            font-weight: 700; 
        }

        .lesson-desc { 
            background: #d4b8a0; 
            padding: 14px; 
            border-radius: 12px; 
            border-left: 4px solid var(--accent-green); 
            text-align: left; 
            font-size: 0.95rem;
            font-weight: 600;
        }

        .image-container { 
            display: flex; 
            justify-content: center; 
        }

        .preview-image { 
            width: 110px; 
            height: 110px; 
            object-fit: cover;
            border-radius: 18px; 
            border: 2px solid var(--border-color); 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(56, 43, 44, 0.12);
        }

        .preview-image.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.8);
            width: 180px;
            height: 180px;
            z-index: 1000;
            cursor: zoom-out;
            box-shadow: 0 10px 30px rgba(56, 43, 44, 0.3);
            border-color: var(--text-main);
        }

        audio {
            width: 100%;
            height: 40px;
        }

        /* КРУГЛАЯ ПРУЖИНЯЩАЯ КНОПКА */
        .round-action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .round-foot-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #d4b8a0; 
            border: 3px solid var(--border-color);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        /* Заметная анимация пружинки (батут) */
        @keyframes springBounce {
            0% { transform: scale(1); }
            35% { transform: scale(0.65); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .round-foot-btn.bounce-anim {
            animation: springBounce 0.4s ease;
        }

        .round-foot-btn.completed {
            background: var(--accent-green); 
            border-color: var(--accent-green-dark);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }

        /* SVG текст по кругу */
        .round-foot-btn svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateText 15s linear infinite;
        }

        @keyframes rotateText {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .round-foot-btn svg text {
            fill: var(--text-main); 
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: fill 0.2s ease;
        }

        .round-foot-btn.completed svg text {
            fill: #ffffff; 
        }

        /* Центр кнопки (лапка) */
        .foot-center-icon {
            font-size: 2.6rem;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }

        /* КНОПКА ТЕЛЕГРАМ ПОД КРУГЛОЙ КНОПКОЙ */
        .tg-report-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--btn-adult);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .tg-report-btn:hover {
            opacity: 0.9;
        }

        /* FOOTER */
        footer { 
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-weight: 700; 
        }

        .contact-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            padding: 12px 24px; 
            background: var(--accent-green); 
            color: #fff; 
            border-radius: 10px; 
            text-decoration: none; 
            box-shadow: 0 2px 6px rgba(56, 43, 44, 0.15);
        }

        .contact-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <h1 class="header-title">PROGRESS TRACKER</h1>
        <div class="path-progress" id="path-progress-container">
            <!-- 8 лапок -->
        </div>
    </header>

    <!-- STUDENT CARD -->
    <section class="student-card">
        <div class="info-item">
            <span class="info-label">Ученик</span>
            <span class="info-value">Имя</span>
        </div>
        <div class="info-item">
            <span class="info-label">Возраст</span>
            <span class="info-value">[ ] лет</span>
        </div>
    </section>

    <!-- НЕДЕЛЯ 1 -->
    <div class="section-title">НЕДЕЛЯ 1 : ЦВЕТА</div>

    <main class="lessons-grid" id="lessons-container" style="display: flex; flex-direction: column; gap: 20px;"></main>

    <!-- FOOTER -->
    <footer>
        <p>Ваш педагог : Татьяна</p>
        <a href="https://t.me/tati_khi" target="_blank" class="contact-btn">СВЯЗАТЬСЯ</a>
    </footer>
</div>

<script>
    const lessons = [
        { id: 1, title: "МИССИЯ 1", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди в комнате что-то <b>КРАСНОЕ</b>, покажи в камеру и громко крикни: «<b>RED!</b>»", status: "Запланировано", image: "IMG_0232.jpeg", audio: "audio/day1.mp3" },
        { id: 2, title: "МИССИЯ 2", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди в комнате что-то <b>СИНЕЕ</b>, покажи в камеру и громко крикни: «<b>BLUE!</b>»", status: "Запланировано", image: "img/day2.jpg", audio: "audio/day2.mp3" }
    ];

    // Надежный звуковой генератор радости
    function playSuccessSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            const playTone = (freq, time, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.25, ctx.currentTime + time);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + time + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + time);
                osc.stop(ctx.currentTime + time + duration);
            };

            playTone(587.33, 0, 0.15);    // Ре 5
            playTone(739.99, 0.12, 0.15); // Фа# 5
            playTone(880.00, 0.24, 0.35); // Ля 5
        } catch (e) {
            console.log("Audio context blocked");
        }
    }

    // Встроенный салют из конфетти (работает всегда без внешних библиотек)
    function triggerConfetti() {
        const colors = ['#75a4b3', '#e4cab4', '#f4d06f', '#ffffff', '#568393', '#ff7675', '#74b9ff'];
        for (let i = 0; i < 70; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'fixed';
            particle.style.width = '10px';
            particle.style.height = '10px';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            particle.style.top = '-10px';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.opacity = Math.random() + 0.5;
            particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            particle.style.zIndex = '9999';
            particle.style.pointerEvents = 'none';
            
            const duration = Math.random() * 2 + 1.5;
            const delay = Math.random() * 0.4;
            
            particle.style.transition = `all ${duration}s ease-in ${delay}s, transform ${duration}s linear ${delay}s`;
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.style.top = '105vh';
                particle.style.transform = `rotate(${Math.random() * 540}deg) translateX(${(Math.random() - 0.5) * 300}px)`;
            }, 50);

            setTimeout(() => {
                particle.remove();
            }, (duration + delay) * 1000);
        }
    }

    function renderPath() {
        const pathContainer = document.getElementById('path-progress-container');
        pathContainer.innerHTML = '';
        
        const completedCount = lessons.filter(l => l.status === "Пройдено").length;
        const activeNodesCount = completedCount * 4;

        for (let i = 0; i < 8; i++) {
            const span = document.createElement('span');
            span.className = 'step-node' + (i < activeNodesCount ? ' active' : '');
            span.innerHTML = '🐾';
            pathContainer.appendChild(span);
        }
    }

    function render() {
        const container = document.getElementById('lessons-container');
        container.innerHTML = '';
        
        const allCompletedBefore = lessons.every(l => l.status === "Пройдено");

        lessons.forEach((l, i) => {
            const isLocked = (i > 0 && lessons[0].status !== "Пройдено");
            const isCompleted = (l.status === "Пройдено");
            
            const card = document.createElement('div');
            card.className = `lesson-card ${isLocked ? 'locked' : ''}`;
            
            card.innerHTML = `
                <div class="adult-check ${isCompleted ? 'completed' : ''}" onclick="toggleStatus(event, ${l.id}, this)">
                    ${isCompleted ? '✓ Выполнено' : '✓ Отметить'}
                </div>

                <div class="lesson-header">
                    <div class="lesson-number">${l.title}</div>
                    <div class="lesson-topic">${l.subtitle}</div>
                </div>

                <div class="lesson-desc">${isLocked ? '🔒 Выполни Миссию 1, чтобы открыть это задание!' : l.desc}</div>

                ${!isLocked ? `
                    <div class="image-container">
                        <img src="${l.image}" class="preview-image" alt="Иллюстрация" onclick="this.classList.toggle('expanded')">
                    </div>
                    <audio controls src="${l.audio}"></audio>
                    
                    <div class="round-action-container">
                        <button class="round-foot-btn ${isCompleted ? 'completed' : ''}" onclick="toggleStatus(event, ${l.id}, this)">
                            <svg viewBox="0 0 100 100">
                                <path id="circlePath-${l.id}" d="M 15, 50 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="transparent"/>
                                <text><textPath href="#circlePath-${l.id}" startOffset="0%">ТОП-ТОП! ГОТОВО! • ТОП-ТОП! ГОТОВО! •</textPath></text>
                            </svg>
                            <span class="foot-center-icon">🐾</span>
                        </button>
                        
                        <a href="https://t.me/tati_khi?text=${encodeURIComponent('Здравствуйте! Отправляю отчет за Миссию ' + l.id)}" target="_blank" class="tg-report-btn">
                            ✈️ Отправить отчет в Telegram
                        </a>
                    </div>
                ` : ''}
            `;
            container.appendChild(card);
        });
        renderPath();

        const allCompletedNow = lessons.every(l => l.status === "Пройдено");
        if (!allCompletedBefore && allCompletedNow) {
            setTimeout(triggerConfetti, 300);
        }
    }

    function toggleStatus(event, id, element) {
        if (event) {
            event.preventDefault();
        }

        // Запуск красивой пружинящей анимации при клике
        const btn = element.closest('.lesson-card')?.querySelector('.round-foot-btn');
        if (btn) {
            btn.classList.remove('bounce-anim');
            void btn.offsetWidth; // сброс анимации
            btn.classList.add('bounce-anim');
        }

        const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;

        const l = lessons.find(x => x.id === id);
        if (id === 2 && lessons[0].status !== "Пройдено") return;
        
        const wasCompleted = (l.status === "Пройдено");
        l.status = wasCompleted ? "Запланировано" : "Пройдено";
        
        if (!wasCompleted) {
            playSuccessSound();
        }
        
        if (id === 1 && l.status === "Запланировано") {
            lessons[1].status = "Запланировано";
        }
        
        render();

        window.scrollTo(0, scrollPosition);
    }

    render();
</script>
</body>
</html>
