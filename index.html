<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Movement Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #E0F2FE 0%, #E0E7FF 100%);
            --card-bg: #FFFFFF;
            --primary: #FF6B6B;
            --primary-shadow: #C53030;
            --secondary: #4ECDC4;
            --secondary-shadow: #2B6CB0;
            --accent: #FFD166;
            --text-color: #2D3748;
            --card-radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 35px;
            border: 4px solid #63B3ED;
            box-shadow: 0 20px 40px rgba(49, 130, 206, 0.15), 0 8px 0 #3182CE;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Премиальная шапка с маскотом и облачком */
        header {
            background: linear-gradient(135deg, #4FD1C5 0%, #319795 100%);
            padding: 20px 15px;
            text-align: center;
            border-bottom: 4px solid #285E61;
            position: relative;
        }

        .mascot-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .mascot-wrapper {
            position: relative;
        }

        .mascot {
            font-size: 44px;
            background: #FFF;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #2B6CB0;
            box-shadow: 0 6px 0 #2B6CB0;
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-3deg); }
        }

        /* Облачко с репликой лисенка */
        .speech-bubble {
            background: #FFFFFF;
            padding: 8px 14px;
            border-radius: 16px;
            border: 3px solid #2B6CB0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08);
            font-size: 13px;
            font-weight: 700;
            color: #2C5282;
            position: relative;
            max-width: 220px;
            text-align: left;
        }

        .header-title h1 {
            font-size: 22px;
            color: white;
            text-shadow: 2px 2px 0 #2B6CB0;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 12px;
            color: #FEFCBF;
            font-weight: 600;
            margin-top: 2px;
        }

        .method-badge
