<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #e4cab4;
            --text-main: #382b2c;
            --border-color: #d1b59c;
            --accent-green: #4a7c59;
            --btn-adult: #d4b8a0;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px 16px; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* HEADER */
        header { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 2px solid var(--border-color); text-align: center; }
        .header-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; }

        /* ИГРОВАЯ ДОРОЖКА */
        .path-progress { display: flex; align-items: center; justify-content: center; gap: 15px; background: #d4b8a0; padding: 10px; border-radius: 12px; }
        .step-node { font-size: 1.5rem; opacity: 0.3; transition: all 0.3s; }
        .step-node.active { opacity: 1; filter: drop-shadow(0 0 5px var(--accent-green)); }

        /* КАРТОЧКА ЗАДАНИЯ */
        .lesson-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 2px solid var(--border-color); position: relative; text-align: center; }
        
        /* КНОПКА-ДУБЛЕР (ДЛЯ РОДИТЕЛЯ) */
        .adult-check { 
            position: absolute; top: 15px; right: 15px; font-size: 0.7rem; 
            background: var(--btn-adult); padding: 5px 10px; border-radius: 8px; 
            cursor: pointer; border: 1px solid var(--border-color); 
        }

        .lesson-header { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 15px; }
        .lesson-number { font-size: 1.1rem; font-weight: 700; }
        .lesson-topic { font-size: 1.1rem; font-weight: 700; }
        .lesson-desc { background: #d4b8a0; padding: 12px; border-radius: 12px; border-left: 4px solid var(--accent-green); margin-bottom: 15px; text-align: left; }

        /* ГЛАВНАЯ КНОПКА "ТОП-ТОП" */
        .big-foot-btn {
            display: block; width: 100%; padding: 20px; background: var(--accent-green);
            color: #fff; border-radius: 15px; font-size: 1.2rem; font-weight: 700;
            border: none; cursor: pointer; margin: 15px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .image-container { display: flex; justify-content: center; margin-bottom: 15px; }
        .preview-image { width: 120px; height: 120px; border-radius: 20px; border: 3px solid var(--border-color); cursor: pointer; }
        
        footer { text-align: center; margin-top: 20px; font-weight: 600; }
        .contact-btn { display: inline-block; padding: 12px 24px; background: var(--accent-green); color: #fff; border-radius: 10px; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="header-title">PROGRESS TRACKER</h1>
        <div class="path-progress">
            <span class="step-node" id="step-1">🐾</span>
            <span class="step-node" id="step-2">🐾</span>
        </div>
    </header>

    <main id="lessons-container"></main>

    <footer>
        <p>Ваш педагог : Татьяна</p>
        <a href="https://t.me/tati_khi" class="contact-btn">СВЯЗАТЬСЯ</a>
    </footer>
</div>

<script>
    const lessons = [
        { id: 1, title: "МИССИЯ 1", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди <b>КРАСНОЕ</b>, покажи в камеру и крикни: «<b>RED!</b>»", status: "Запланировано", image: "IMG_0232.jpeg", audio: "audio/day1.mp3" },
        { id: 2, title: "МИССИЯ 2", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди <b>СИНЕЕ</b>, покажи в камеру и крикни: «<b>BLUE!</b>»", status: "Запланировано", image: "img/day2.jpg", audio: "audio/day2.mp3" }
    ];

    function render() {
        const container = document.getElementById('lessons-container');
        container.innerHTML = '';
        lessons.forEach((l, i) => {
            const isLocked = (i > 0 && lessons[0].status !== "Пройдено");
            const card = document.createElement('div');
            card.className = `lesson-card ${isLocked ? 'locked' : ''}`;
            card.innerHTML = `
                <div class="adult-check" onclick="toggleStatus(${l.id})">✓ Выполнено</div>
                <div class="lesson-header">
                    <div class="lesson-number">${l.title}</div>
                    <div class="lesson-topic">${l.subtitle}</div>
                </div>
                <div class="lesson-desc">${isLocked ? '🔒 Выполни Миссию 1!' : l.desc}</div>
                ${!isLocked ? `
                    <div class="image-container"><img src="${l.image}" class="preview-image"></div>
                    <audio controls src="${l.audio}"></audio>
                    <button class="big-foot-btn" onclick="toggleStatus(${l.id})">🐾 Топ-топ, готово!</button>
                ` : ''}
            `;
            container.appendChild(card);
        });
        updateProgress();
    }

    function toggleStatus(id) {
        const l = lessons.find(x => x.id === id);
        l.status = l.status === "Пройдено" ? "Запланировано" : "Пройдено";
        render();
    }

    function updateProgress() {
        document.querySelectorAll('.step-node').forEach((n, i) => {
            if (lessons[i].status === "Пройдено") n.classList.add('active');
            else n.classList.remove('active');
        });
    }

    render();
</script>
</body>
</html>
