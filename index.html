<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #e4cab4;
            --text-main: #382b2c;
            --border-color: #d1b59c;
            --accent-green: #4a7c59;
            --btn-adult: #d4b8a0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px; 
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* HEADER */
        header { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 20px; 
            border: 2px solid var(--border-color); 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
        }

        .header-title { 
            font-size: 1.4rem; 
            font-weight: 700; 
            margin-bottom: 15px; 
            letter-spacing: 0.05em;
        }

        /* ИГРОВАЯ ДОРОЖКА */
        .path-progress { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            background: #d4b8a0; 
            padding: 10px; 
            border-radius: 12px; 
        }

        .step-node { 
            font-size: 1.5rem; 
            opacity: 0.3; 
            transition: all 0.3s; 
        }

        .step-node.active { 
            opacity: 1; 
            filter: drop-shadow(0 0 5px var(--accent-green)); 
        }

        /* БЛОК ИМЕНИ И ВОЗРАСТА */
        .student-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 24px;
            border: 2px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
            opacity: 0.8;
            font-weight: 600;
        }

        .info-value {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
        }

        /* НАДПИСЬ НЕДЕЛЯ 1 */
        .section-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        /* КАРТОЧКА ЗАДАНИЯ */
        .lesson-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 24px; 
            border: 2px solid var(--border-color); 
            position: relative; 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* КНОПКА-ДУБЛЕР (ДЛЯ РОДИТЕЛЯ В УГЛУ) */
        .adult-check { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            font-size: 0.75rem; 
            background: var(--btn-adult); 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid var(--border-color);
            font-weight: 600;
        }

        .adult-check.completed {
            background: var(--accent-green);
            color: #fff;
        }

        .lesson-header { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
        }

        .lesson-number { 
            font-size: 1.15rem; 
            font-weight: 700; 
        }

        .lesson-topic { 
            font-size: 1.15rem; 
            font-weight: 700; 
        }

        .lesson-desc { 
            background: #d4b8a0; 
            padding: 14px; 
            border-radius: 12px; 
            border-left: 4px solid var(--accent-green); 
            text-align: left; 
            font-size: 0.95rem;
        }

        .image-container { 
            display: flex; 
            justify-content: center; 
        }

        .preview-image { 
            width: 110px; 
            height: 110px; 
            object-fit: cover;
            border-radius: 18px; 
            border: 2px solid var(--border-color); 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(56, 43, 44, 0.12);
        }

        .preview-image.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.8);
            width: 180px;
            height: 180px;
            z-index: 1000;
            cursor: zoom-out;
            box-shadow: 0 10px 30px rgba(56, 43, 44, 0.3);
            border-color: var(--text-main);
        }

        audio {
            width: 100%;
            height: 40px;
        }

        /* КРУГЛАЯ КНОПКА С ТЕКСТОМ ПО ПЕРИМЕТРУ И ЛАПКОЙ В ЦЕНТРЕ */
        .round-action-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .round-foot-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--accent-green);
            border: 3px solid #385e44;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .round-foot-btn:hover {
            transform: scale(1.05);
        }

        .round-foot-btn.completed {
            background: #385e44;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }

        /* SVG текст по кругу */
        .round-foot-btn svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateText 15s linear infinite;
        }

        @keyframes rotateText {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .round-foot-btn svg text {
            fill: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 3.5px;
            text-transform: uppercase;
        }

        /* Центр кнопки (лапка) */
        .foot-center-icon {
            font-size: 2.2rem;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* FOOTER */
        footer { 
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 16px rgba(56, 43, 44, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-weight: 600; 
        }

        .contact-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            padding: 12px 24px; 
            background: var(--accent-green); 
            color: #fff; 
            border-radius: 10px; 
            text-decoration: none; 
            box-shadow: 0 2px 6px rgba(56, 43, 44, 0.15);
        }

        .contact-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="header-title">PROGRESS TRACKER</h1>
        <div class="path-progress">
            <span class="step-node" id="step-1">🐾</span>
            <span class="step-node" id="step-2">🐾</span>
        </div>
    </header>

    <section class="student-card">
        <div class="info-item">
            <span class="info-label">Ученик</span>
            <span class="info-value">Имя</span>
        </div>
        <div class="info-item">
            <span class="info-label">Возраст</span>
            <span class="info-value">[ ] лет</span>
        </div>
    </section>

    <div class="section-title">НЕДЕЛЯ 1 : ЦВЕТА</div>

    <main class="lessons-grid" id="lessons-container" style="display: flex; flex-direction: column; gap: 20px;"></main>

    <footer>
        <p>Ваш педагог : Татьяна</p>
        <a href="https://t.me/tati_khi" target="_blank" class="contact-btn">СВЯЗАТЬСЯ</a>
    </footer>
</div>

<script>
    const lessons = [
        { id: 1, title: "МИССИЯ 1", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди в комнате что-то <b>КРАСНОЕ</b>, покажи в камеру и громко крикни: «<b>RED!</b>»", status: "Запланировано", image: "IMG_0232.jpeg", audio: "audio/day1.mp3" },
        { id: 2, title: "МИССИЯ 2", subtitle: "«ОХОТА ЗА ЦВЕТАМИ»", desc: "🏃‍♂️ Задание: Найди в комнате что-то <b>СИНЕЕ</b>, покажи в камеру и громко крикни: «<b>BLUE!</b>»", status: "Запланировано", image: "img/day2.jpg", audio: "audio/day2.mp3" }
    ];

    function render() {
        const container = document.getElementById('lessons-container');
        container.innerHTML = '';
        
        lessons.forEach((l, i) => {
            const isLocked = (i > 0 && lessons[0].status !== "Пройдено");
            const isCompleted = (l.status === "Пройдено");
            
            const card = document.createElement('div');
            card.className = `lesson-card ${isLocked ? 'locked' : ''}`;
            
            card.innerHTML = `
                <div class="adult-check ${isCompleted ? 'completed' : ''}" onclick="toggleStatus(${l.id})">
                    ${isCompleted ? '✓ Выполнено' : '✓ Отметить'}
                </div>

                <div class="lesson-header">
                    <div class="lesson-number">${l.title}</div>
                    <div class="lesson-topic">${l.subtitle}</div>
                </div>

                <div class="lesson-desc">${isLocked ? '🔒 Выполни Миссию 1, чтобы открыть это задание!' : l.desc}</div>

                ${!isLocked ? `
                    <div class="image-container">
                        <img src="${l.image}" class="preview-image" alt="Иллюстрация" onclick="this.classList.toggle('expanded')">
                    </div>
                    <audio controls src="${l.audio}"></audio>
                    
                    <div class="round-action-btn-container">
                        <button class="round-foot-btn ${isCompleted ? 'completed' : ''}" onclick="toggleStatus(${l.id})">
                            <svg viewBox="0 0 100 100">
                                <path id="circlePath-${l.id}" d="M 15, 50 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="transparent"/>
                                <text><textPath href="#circlePath-${l.id}" startOffset="0%">ТОП-ТОП, ГОТОВО! • ТОП-ТОП, ГОТОВО! •</textPath></text>
                            </svg>
                            <span class="foot-center-icon">🐾</span>
                        </button>
                    </div>
                ` : ''}
            `;
            container.appendChild(card);
        });
        updateProgress();
    }

    function toggleStatus(id) {
        const l = lessons.find(x => x.id === id);
        // Проверка блокировки для второй миссии
        if (id === 2 && lessons[0].status !== "Пройдено") return;
        
        l.status = l.status === "Пройдено" ? "Запланировано" : "Пройдено";
        
        // Если отменили первую миссию, сбрасываем вторую
        if (id === 1 && l.status === "Запланировано") {
            lessons[1].status = "Запланировано";
        }
        
        render();
    }

    function updateProgress() {
        document.querySelectorAll('.step-node').forEach((n, i) => {
            if (lessons[i].status === "Пройдено") n.classList.add('active');
            else n.classList.remove('active');
        });
    }

    render();
</script>
</body>
</html>
